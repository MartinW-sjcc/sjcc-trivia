<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SJCC Member Trivia of the Day</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    text-align: center;
  }

  #container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #top {
    padding: 20px;
    background: #003366;
    color: white;
  }

  #question-area {
    padding: 20px;
  }

  .logo {
    width: 300px;      
    max-width: 80%;    
    margin-bottom: 20px;
  }

  #formFrame {
    width: 100%;
    height: 100vh; 
    border: none;
    display: none;
  }

  #startButton {
    padding: 18px 30px;
    font-size: 22px;
    background: #0077cc;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  #startButton:hover {
    background: #005fa3;
  }

  .btn-small {
    display: inline-block;
    padding: 12px 25px;
    margin-top: 15px;
    background: #005A9C;
    color: white;
    font-size: 18px;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
  }

  #resultsPanel {
    display: none;
    margin-top: 30px;
  }

  #resultsPanel iframe {
    width: 95%;
    height: 350px;
    border: none;
    border-radius: 10px;
  }

  img.qr {
    width: 220px;
    margin-top: 20px;
  }
</style>

<script>
// ===== CONFIGURATION =====
const FORM_URL = "https://docs.google.com/forms/d/1sEM61qfEmEz5GBjCW0SmVohOpn_gEV-KWhpF60wCbec/viewform";
const KIOSK_URL = "https://martinw-sjcc.github.io/sjcc-trivia/";

const RESULTS_URL_TODAY = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSsuXBXwKN1wxzB78a6DOJJFZFYuGk1iH7GviRi1ruhHed8NnP-7EZhRM6BSB20vv3e8YQZdceI-Az4/pubchart?oid=768898762&format=interactive";

// Use your published Summaries sheet URL here:
const SUMMARIES_BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSsuXBXwKN1wxzB78a6DOJJFZFYuGk1iH7GviRi1ruhHed8NnP-7EZhRM6BSB20vv3e8YQZdceI-Az4/pubhtml?gid=313092836&single=true";

const RESET_TIME = 35000; // 35 seconds

let resetTimer, resultsTimer;

function startResetTimer() {
  clearTimeout(resetTimer);
  resetTimer = setTimeout(() => {
    window.location.href = KIOSK_URL;
  }, RESET_TIME);
}

function startTrivia() {
  document.getElementById("mainScreen").style.display = "none";
  document.getElementById("formFrame").src = FORM_URL;
  document.getElementById("formFrame").style.display = "block";
  startResetTimer();
}

window.onload = startResetTimer;

function showResultsPanel(url) {
  const panel = document.getElementById("resultsPanel");
  const frame = document.getElementById("resultsFrame");

  frame.src = url;
  panel.style.display = "block";

  clearTimeout(resultsTimer);
  resultsTimer = setTimeout(() => {
    panel.style.display = "none";
    frame.src = "";
  }, 30000);
}

function showTodayResults() {
  showResultsPanel(RESULTS_URL_TODAY);
}

function showYesterdayResults() {
  const today = new Date();
  const yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
  const yStr = yesterday.toISOString().split("T")[0];

  const url = SUMMARIES_BASE_URL + "#gid=313092836&range=find:" + encodeURIComponent("Summary for " + yStr);
  showResultsPanel(url);
}
</script>

</head>
<body>

<div id="container">

  <div id="mainScreen">
    <div id="top">
      <h1>SJCC Member Trivia of the Day</h1>
    </div>

    <div id="question-area">
      <img class="logo" src="251104-website-homepage-header-1180x180-1.jpg" alt="SJCC Logo" />

      <br><br>

      <button id="startButton" onclick="startTrivia()">Answer Today's Trivia Now</button>

      <br><br><br>

      <!-- VIEW RESULTS buttons -->
      <a id="resultsBtn" class="btn-small" onclick="showTodayResults()">View Today’s Results</a>
      <a id="yesterdayBtn" class="btn-small" onclick="showYesterdayResults()">View Yesterday’s Results</a>

      <div id="resultsPanel">
        <iframe id="resultsFrame" src=""></iframe>
        <p style="font-size:14px;color:#555;margin-top:10px;">
          This panel will close automatically.
        </p>
      </div>
    </div>
  </div>

  <iframe id="formFrame"></iframe>
</div>

</body>
</html>
